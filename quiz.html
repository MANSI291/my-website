
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Ethics Quiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">🛡️ CyberWise</div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/lessons">Lessons</a></li>
            <li><a href="/quiz">Quiz</a></li>
            <li><a href="/results">Quiz Results</a></li>
        </ul>
    </nav>

    <!-- Quiz Introduction -->
    <section class="about">
        <h2>Cyber Ethics Quiz</h2>

        <p>
            Test your knowledge about safe and responsible
            internet usage.
        </p>
    </section>

    <!-- Quiz Form -->
    <section class="topics">

        <form action="{{ url_for('submit') }}" method="POST">

            <!-- Student Name -->
            <div class="card">
                <h3>Enter Your Name</h3>

                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <!-- Quiz Questions -->
            {% for question in questions %}

            <div class="card"
                 style="margin-top: 20px; text-align: left;">

                <h3>
                    {{ loop.index }}. {{ question["question"] }}
                </h3>

                <br>

                <label>
                    <input
                        type="radio"
                        name="question_{{ question['id'] }}"
                        value="A"
                        required
                    >
                    {{ question["option_a"] }}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question_{{ question['id'] }}"
                        value="B"
                    >
                    {{ question["option_b"] }}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question_{{ question['id'] }}"
                        value="C"
                    >
                    {{ question["option_c"] }}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question_{{ question['id'] }}"
                        value="D"
                    >
                    {{ question["option_d"] }}
                </label>

            </div>

            {% endfor %}

            <!-- Submit Quiz -->
            <br>

            <button type="submit" class="btn">
                Submit Quiz
            </button>

        </form>

    </section>

    <!-- Footer -->
    <footer>
        <p>CyberWise Quiz System</p>
    </footer>

</body>
</html>
```
